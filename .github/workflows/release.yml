name: Release to Maven Central

# Manual: Actions > Release to Maven Central > Run workflow, on a commit whose gradle.properties holds a
# release version (no -SNAPSHOT). The bundle is uploaded as USER_MANAGED: it is validated by the Central
# Portal and published only when someone presses "Publish" there. See RELEASING.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: maven-central
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v6

      # Fails in seconds, with a clear message, on the usual mistakes: a public or truncated key in
      # SIGNING_KEY, or a passphrase that does not unlock it.
      - name: Check the signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          case "$SIGNING_KEY" in
            *"-----BEGIN PGP PRIVATE KEY BLOCK-----"*"-----END PGP PRIVATE KEY BLOCK-----"*) ;;
            *"-----BEGIN PGP PUBLIC KEY BLOCK-----"*)
              echo "::error::SIGNING_KEY holds a public key. It needs the private key: gpg --armor --export-secret-keys KEYID"
              exit 1 ;;
            *)
              echo "::error::SIGNING_KEY is not a whole private key: paste everything from -----BEGIN PGP PRIVATE KEY BLOCK----- to -----END PGP PRIVATE KEY BLOCK-----"
              exit 1 ;;
          esac
          export GNUPGHOME="$(mktemp -d)"
          if ! printf '%s\n' "$SIGNING_KEY" | gpg --batch --quiet --import; then
            lines=$(printf '%s\n' "$SIGNING_KEY" | wc -l)
            longest=$(printf '%s\n' "$SIGNING_KEY" | awk '{ if (length > m) m = length } END { print m + 0 }')
            echo "::error::gpg cannot read SIGNING_KEY (${lines} lines, the longest of ${longest} characters; an exported key has dozens of lines of at most 64 characters). The text was changed or cut while copying it: export it again and paste it unchanged."
            exit 1
          fi
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')
          echo "Signing key: $fpr"
          if ! echo check | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 --sign 3<<<"$SIGNING_PASSWORD" > /dev/null; then
            echo "::error::SIGNING_PASSWORD does not unlock the signing key $fpr"
            exit 1
          fi
          if ! curl -sSf -o /dev/null "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x$fpr"; then
            echo "::warning::The public key $fpr is not on keyserver.ubuntu.com: the Central Portal rejects signatures it cannot verify (gpg --keyserver keyserver.ubuntu.com --send-keys $fpr)"
          fi

      - name: Install gcc and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc ffmpeg

      - name: Test and build the signed bundle
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: >
          ./gradlew check centralBundle
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
          -Dorg.gradle.java.installations.auto-download=false

      # Kept as an artifact too: if the upload below fails, the bundle can be uploaded by hand in the
      # Central Portal (Publish > Publish Component).
      - name: Keep the bundle
        uses: actions/upload-artifact@v7
        with:
          name: central-bundle
          path: build/central/*-bundle.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload to the Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          bundle=$(ls build/central/*-bundle.zip)
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $token" \
            -F "bundle=@$bundle" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=USER_MANAGED"
