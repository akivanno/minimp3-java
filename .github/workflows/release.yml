name: Release to Maven Central

# Manual: Actions > Release to Maven Central > Run workflow, on a commit whose gradle.properties holds a
# release version (no -SNAPSHOT). The bundle is uploaded as USER_MANAGED: it is validated by the Central
# Portal and published only when someone presses "Publish" there. See RELEASING.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: maven-central
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install gcc and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc ffmpeg

      - name: Test and build the signed bundle
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: >
          ./gradlew check centralBundle
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
          -Dorg.gradle.java.installations.auto-download=false

      - name: Upload to the Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          bundle=$(ls build/central/*-bundle.zip)
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $token" \
            -F "bundle=@$bundle" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=USER_MANAGED"
